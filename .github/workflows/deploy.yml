name: Publicar ramas en GitHub Pages

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
  workflow_dispatch:

# Each deployment updates the shared site, retaining existing branch folders.
concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref_type == 'branch' && github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUBLISH_BRANCH: ${{ github.ref_name }}
      PUBLISH_COMMIT: ${{ github.sha }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ruta pública de esta rama
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const branch = process.env.PUBLISH_BRANCH.split('/').map(encodeURIComponent).join('/');
          appendFileSync(process.env.GITHUB_ENV, `VITE_BASE_PATH=/${repo}/${branch}/\n`);
          NODE
      - run: npm run build
      - name: Recuperar las publicaciones existentes
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add --detach .pages-site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages .pages-site
          fi
      - name: Actualizar solo la carpeta de esta rama
        run: npx tsx scripts/pages.ts .pages-site dist "$PUBLISH_BRANCH" "$PUBLISH_COMMIT"
      - name: Conservar el sitio para futuras publicaciones
        id: site
        run: |
          git -C .pages-site add --all
          if ! git -C .pages-site diff --cached --quiet; then
            git -C .pages-site commit -m "Deploy $PUBLISH_BRANCH at $PUBLISH_COMMIT"
            git -C .pages-site push origin HEAD:gh-pages
          fi
          printf 'commit=%s\n' "$(git -C .pages-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publicar el sitio completo
        id: deployment
        uses: actions/github-script@v8
        env:
          SITE_COMMIT: ${{ steps.site.outputs.commit }}
        with:
          script: |
            // Use the combined site's commit, since multiple source branches
            // can share the same SHA and Pages deduplicates builds by version.
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId
            });
            const artifact = data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
            if (!artifact) throw new Error('No se encontró el artefacto de Pages');
            const { data: deployment } = await github.rest.repos.createPagesDeployment({
              owner, repo, artifact_id: artifact.id,
              pages_build_version: process.env.SITE_COMMIT,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.page_url);
            const deployment_id = deployment.id || deployment.status_url.split('/').pop();
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: result } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                owner, repo, pages_deployment_id: deployment_id
              });
              core.info(`Pages: ${result.status}`);
              if (result.status === 'succeed') return;
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
                   'deployment_cancelled', 'deployment_lost'].includes(result.status)) {
                throw new Error(`Despliegue fallido: ${result.status}`);
              }
            }
            throw new Error('Se agotó el tiempo de espera de Pages');
